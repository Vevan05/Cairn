name: nightly-stats
on:
  schedule:
    - cron: "0 6 * * *"  # once a day 06:00 UTC
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # In a full implementation, stats reads exposures/outcomes from Postgres
      # and writes aggregated rows to results table. Until experiment tables
      # exist, mark no-op.
      - run: python -c 'print("stats job placeholder: add read exposures -> upsert results")'
services:
  - type: web
    name: cairn-api
    env: python
    plan: free
    # The corpus artifacts are committed, so the deploy only installs the
    # lightweight runtime. The last step prefetches the ONNX embedding model
    # (~130 MB) into the image so cold starts don't re-download it.
    buildCommand: pip install -r requirements.txt && python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Restrict to your frontend origin in production, e.g.
      # "https://cairn.vercel.app". "*" is fine for a public demo.
      - key: CORS_ORIGINS
        value: "*"
      # Synthetic users seeded into the demo experiment at startup (0 disables).
      - key: DEMO_SEED_USERS
        value: "1200"
